name: Pi Extension CI

on:
  pull_request:
    paths:
      - "pi-extension/**"
      - ".github/workflows/pi-extension-ci.yml"
  push:
    branches:
      - main
    paths:
      - "pi-extension/**"
      - ".github/workflows/pi-extension-ci.yml"

permissions:
  contents: read

jobs:
  build-and-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        runtime: [node20, node22, bun]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: pi-extension

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node 20
        if: matrix.runtime == 'node20'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Setup Node 22
        if: matrix.runtime == 'node22'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: npm ci

      - name: Build dist/index.mjs
        run: npm run build

      # pi loads dist/index.mjs, not src/. A committed bundle that no longer
      # matches src is the failure mode this catches. One leg is enough: the
      # lockfile pins esbuild, so every leg produces the same bytes.
      - name: Committed bundle matches a fresh build
        if: matrix.os == 'ubuntu-latest' && matrix.runtime == 'node22'
        run: git diff --exit-code -- dist/index.mjs

      - name: Verify bundle, tools, auth, and no-AutoLog assertions
        run: npm run smoke

      - name: Verify bundle under Bun
        if: matrix.runtime == 'bun'
        run: bun test/smoke.mjs

      - name: Package contents
        if: matrix.os == 'ubuntu-latest' && matrix.runtime == 'node22'
        run: npm pack --dry-run

  e2e:
    # The end-to-end check drives the real stdio MCP server, so it needs the
    # Rust core built from this checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Build memnest
        run: cargo build --release --locked --manifest-path core/Cargo.toml
      - name: Install dependencies
        working-directory: pi-extension
        run: npm ci
      - name: MCP end-to-end
        working-directory: pi-extension
        env:
          MEMNEST_BIN: ${{ github.workspace }}/core/target/release/memnest
        run: npm run e2e
