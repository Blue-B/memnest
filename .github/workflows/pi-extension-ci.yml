name: Pi Extension CI

on:
  pull_request:
    paths:
      - "pi-extension/**"
      - ".github/workflows/pi-extension-ci.yml"
  push:
    branches:
      - main
    paths:
      - "pi-extension/**"
      - ".github/workflows/pi-extension-ci.yml"

permissions:
  contents: read

jobs:
  build-and-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        runtime: [node20, node22, bun]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: pi-extension

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node 20
        if: matrix.runtime == 'node20'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Setup Node 22
        if: matrix.runtime == 'node22'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: npm ci

      - name: Build dist/index.mjs
        run: npm run build

      - name: Verify bundle loads and 20 tools register
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bun test/smoke.mjs
          else
            node test/smoke.mjs
          fi
