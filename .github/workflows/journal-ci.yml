name: Journal CI

on:
  pull_request:
    paths:
      - "journal/**"
      - "core/**"
      - ".github/workflows/journal-ci.yml"
  push:
    branches:
      - main
    paths:
      - "journal/**"
      - "core/**"
      - ".github/workflows/journal-ci.yml"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        runtime: [node20, node22, bun]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: journal
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node 20
        if: matrix.runtime == 'node20'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Setup Node 22
        if: matrix.runtime == 'node22'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - name: npm pack dry-run
        run: npm pack --dry-run

  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install journal dependencies
        working-directory: journal
        run: npm install --omit=dev --no-package-lock
      - name: Build memnest server
        run: cargo build --release --locked --manifest-path core/Cargo.toml
      - name: Start and seed memnest server
        env:
          MEMNEST_DATA_DIR: ${{ runner.temp }}/memnest
          MEMNEST_EMBED_KEEP_LOADED: "1"
        run: |
          mkdir -p "$MEMNEST_DATA_DIR"
          nohup core/target/release/memnest --host 127.0.0.1 --port 3111 --data-dir "$MEMNEST_DATA_DIR" > "$RUNNER_TEMP/memnest.log" 2>&1 &
          for _ in {1..30}; do
            curl -fsS http://127.0.0.1:3111/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3111/health >/dev/null
          curl -fsS http://127.0.0.1:3111/add \
            -H 'content-type: application/json' \
            -d '{"project":"ci","text":"journal smoke initial seed","metadata":{"chunk_type":"manual","importance":"log"}}' >/dev/null
          for _ in {1..30}; do
            result=$(curl -fsS http://127.0.0.1:3111/search \
              -H 'content-type: application/json' \
              -d '{"query":"journal smoke initial seed","n_results":3}')
            grep -q 'journal smoke initial seed' <<< "$result" && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/memnest.log"
          exit 1
      - name: Smoke test
        working-directory: journal
        env:
          MEMNEST_URL: http://127.0.0.1:3111
          MEMNEST_DB: ${{ runner.temp }}/memnest/memory.db
        run: node test/smoke.mjs
