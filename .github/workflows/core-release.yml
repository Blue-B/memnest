name: Core Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    # Linux only. Nothing downloads a published Windows archive: install.sh
    # refuses a non-Linux host, and install-windows.ps1 takes a -BinPath that
    # defaults to a locally built target\release\memnest.exe, which is the
    # path the operations guide documents. Windows still gets compile coverage
    # from the windows-latest job in core-ci.yml. To publish Windows builds
    # again, restore the x86_64-pc-windows-msvc target and its packaging step,
    # which needs the WINDOWS_CODESIGN_PFX_BASE64 and WINDOWS_CODESIGN_PASSWORD
    # secrets; scripts/sign-windows.ps1 is kept for that.
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # A tag is the only trigger, so this is the one place that can stop
      # v0.3.0 from shipping a binary that still reports 0.2.0.
      - name: Tag matches core/Cargo.toml version
        shell: bash
        run: |
          manifest_version="$(sed -n '/^\[package\]/,/^\[/ s/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ -z "$manifest_version" ]; then
            echo "could not read version from core/Cargo.toml" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$manifest_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match core/Cargo.toml version $manifest_version" >&2
            echo "expected tag: v$manifest_version" >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches crate version $manifest_version"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      # Environment-variable and vault lifecycle tests mutate process-global
      # state, so they cannot share a process. Only the native target can run
      # its own tests on this runner.
      - name: Test
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --locked -- --test-threads=1

      - name: Build release
        shell: bash
        run: cargo build --release --locked --target "$TARGET"

      - name: Get version
        id: get_version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/memnest" dist/
          cp -r scripts dist/
          cp -r packaging dist/
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          cp ../README.md dist/
          tar -czf "memnest-$VERSION-$TARGET.tar.gz" -C dist .
          sha256sum "memnest-$VERSION-$TARGET.tar.gz" > "memnest-$VERSION-$TARGET.tar.gz.sha256"

      # Unpack exactly what would be published and run it, so a broken archive
      # fails here instead of on a user's machine. A cross-built aarch64 binary
      # cannot execute on this runner, so it only gets the layout checks.
      - name: Verify packaged archive
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        shell: bash
        run: |
          archive="memnest-$VERSION-$TARGET.tar.gz"
          scripts/verify-artifact.sh "$archive" "$archive.sha256"
          unpacked="$(mktemp -d)"
          tar -xzf "$archive" -C "$unpacked"
          test -f "$unpacked/THIRD_PARTY_NOTICES.md"
          test -x "$unpacked/memnest"
          if [ "$TARGET" = "x86_64-unknown-linux-gnu" ]; then
            packaged_version="$("$unpacked/memnest" --version)"
            echo "packaged binary reports: $packaged_version"
            case "$packaged_version" in
              *"${VERSION#v}"*) ;;
              *) echo "packaged binary does not report ${VERSION#v}" >&2; exit 1 ;;
            esac
            "$unpacked/memnest" --help > /dev/null
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memnest-${{ matrix.target }}
          path: core/memnest-*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: memnest-*
          merge-multiple: true

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --generate-notes \
            --title "memnest $GITHUB_REF_NAME" \
            --verify-tag
