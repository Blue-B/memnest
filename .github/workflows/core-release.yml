name: Core Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    # Linux only. Nothing downloads a published Windows archive: install.sh
    # refuses a non-Linux host, and install-windows.ps1 takes a -BinPath that
    # defaults to a locally built target\release\memnest.exe, which is the
    # path the operations guide documents. Windows still gets compile coverage
    # from the windows-latest job in core-ci.yml. To publish Windows builds
    # again, restore the x86_64-pc-windows-msvc target and its packaging step,
    # which needs the WINDOWS_CODESIGN_PFX_BASE64 and WINDOWS_CODESIGN_PASSWORD
    # secrets; scripts/sign-windows.ps1 is kept for that.
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build release
        shell: bash
        run: cargo build --release --target "$TARGET"

      - name: Get version
        id: get_version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/memnest" dist/
          cp -r scripts dist/
          cp -r packaging dist/
          cp -r static dist/
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          cp ../README.md dist/
          tar -czf "memnest-$VERSION-$TARGET.tar.gz" -C dist .
          sha256sum "memnest-$VERSION-$TARGET.tar.gz" > "memnest-$VERSION-$TARGET.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memnest-${{ matrix.target }}
          path: core/memnest-*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: memnest-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          generate_release_notes: true
