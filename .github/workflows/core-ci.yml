name: Core CI

on:
  pull_request:
    paths:
      - "core/**"
      - ".github/workflows/core-ci.yml"
      - ".github/workflows/core-release.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "core/**"
      - ".github/workflows/core-ci.yml"
      - ".github/workflows/core-release.yml"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      # Serial by policy: the environment-variable and vault lifecycle tests
      # set process-global state (MEMNEST_* vars, the global CIPHER), so a
      # parallel runner makes them race each other.
      - name: Test
        run: cargo test --locked --quiet -- --test-threads=1
      - name: Release build
        run: cargo build --release --locked
      - name: Transcript identity and retry E2E
        run: bash scripts/transcript-e2e.sh target/release/memnest
      # `bash -n` does not catch an unbound variable under `set -u`, which is
      # how preflight shipped broken once. Run it for real instead.
      - name: Installer scripts run without unbound variables
        run: |
          set -o pipefail
          output="$(MEMNEST_DATA_DIR="$RUNNER_TEMP/memnest-preflight" \
            bash scripts/preflight-linux.sh --user --bin target/release/memnest 2>&1 || true)"
          printf '%s\n' "$output"
          if printf '%s' "$output" | grep -qi 'unbound variable'; then
            echo "preflight-linux.sh referenced an unset variable" >&2
            exit 1
          fi
          bash scripts/install.sh --help > /dev/null
          bash scripts/install-linux.sh --help > /dev/null
          bash scripts/uninstall-linux.sh --help > /dev/null
          bash scripts/setup.sh --help > /dev/null
          bash scripts/install-macos.sh --help > /dev/null
          bash scripts/uninstall-macos.sh --help > /dev/null
          bash scripts/verify-packaging.sh
          bash scripts/verify-macos-packaging.sh
          python3 scripts/test-setup-clients.py
          bash scripts/support-bundle.sh --out "$RUNNER_TEMP/support.txt" > /dev/null
          echo body > "$RUNNER_TEMP/artifact"
          sha256sum "$RUNNER_TEMP/artifact" > "$RUNNER_TEMP/artifact.sha256"
          bash scripts/verify-artifact.sh "$RUNNER_TEMP/artifact" "$RUNNER_TEMP/artifact.sha256"
      - name: Third-party notices are current
        run: python3 scripts/generate-third-party-notices.py --check

  macos-packaging:
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Native release build
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Installer and launchd contract checks
        run: bash scripts/verify-macos-packaging.sh

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Test
        run: cargo test --locked --quiet -- --test-threads=1
      - name: Release build
        run: cargo build --release --locked
      - name: Validate PowerShell installers
        shell: pwsh
        run: .\scripts\verify-release.ps1
      - name: Validate Bash installers
        shell: bash
        run: |
          bash -n scripts/install.sh
          bash -n scripts/install-linux.sh
          bash -n scripts/uninstall-linux.sh
          bash -n scripts/preflight-linux.sh
          bash -n scripts/verify-artifact.sh
          bash -n scripts/validate-installed.sh
          bash -n scripts/support-bundle.sh
          bash -n scripts/setup.sh
          bash -n scripts/install-macos.sh
          bash -n scripts/uninstall-macos.sh
          bash -n scripts/validate-installed-macos.sh
      - name: License metadata
        shell: bash
        run: python3 scripts/check-licenses.py
