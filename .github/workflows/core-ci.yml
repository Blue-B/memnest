name: Core CI

on:
  pull_request:
    paths:
      - "core/**"
      - ".github/workflows/core-ci.yml"
      - ".github/workflows/core-release.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "core/**"
      - ".github/workflows/core-ci.yml"
      - ".github/workflows/core-release.yml"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      # Serial by policy: the environment-variable and vault lifecycle tests
      # set process-global state (MEMNEST_* vars, the global CIPHER), so a
      # parallel runner makes them race each other.
      - name: Test
        run: cargo test --locked --quiet -- --test-threads=1
      - name: Release build
        run: cargo build --release --locked
      - name: Transcript identity and retry E2E
        run: bash scripts/transcript-e2e.sh target/release/memnest
      # `bash -n` does not catch an unbound variable under `set -u`, which is
      # how preflight shipped broken once. Run it for real instead.
      - name: Installer scripts run without unbound variables
        run: |
          set -o pipefail
          output="$(MEMNEST_DATA_DIR="$RUNNER_TEMP/memnest-preflight" \
            bash scripts/preflight-linux.sh --user --bin target/release/memnest 2>&1 || true)"
          printf '%s\n' "$output"
          if printf '%s' "$output" | grep -qi 'unbound variable'; then
            echo "preflight-linux.sh referenced an unset variable" >&2
            exit 1
          fi
          bash scripts/install.sh --help > /dev/null
          bash scripts/install-linux.sh --help > /dev/null
          bash scripts/uninstall-linux.sh --help > /dev/null
          bash scripts/setup.sh --help > /dev/null
          bash scripts/install-macos.sh --help > /dev/null
          bash scripts/uninstall-macos.sh --help > /dev/null
          bash scripts/verify-packaging.sh
          bash scripts/verify-macos-packaging.sh
          python3 scripts/test-setup-clients.py
          python3 scripts/test-install-download.py
          python3 scripts/test-install-linux.py
          bash scripts/support-bundle.sh --out "$RUNNER_TEMP/support.txt" > /dev/null
          echo body > "$RUNNER_TEMP/artifact"
          sha256sum "$RUNNER_TEMP/artifact" > "$RUNNER_TEMP/artifact.sha256"
          bash scripts/verify-artifact.sh "$RUNNER_TEMP/artifact" "$RUNNER_TEMP/artifact.sha256"
      - name: Third-party notices are current
        run: python3 scripts/generate-third-party-notices.py --check
      # verify-contract.sh calls what the README documents on a running
      # service, and guards the save guidance that is written twice (the MCP
      # tool list and the pi bundle). The model cache left by `cargo test` is
      # reused so the search probe does not download it again.
      - name: Documented contract matches the running service
        run: |
          data="$RUNNER_TEMP/contract-data"
          mkdir -p "$data"
          ln -s "$PWD/target/test-model-cache" "$data/models"
          target/release/memnest --data-dir "$data" --port 3997 > "$RUNNER_TEMP/contract.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3997/health >/dev/null 2>&1 && break
            sleep 1
          done
          # Load the embedding model first; the script's search probe allows 15 seconds.
          curl -fsS -m 300 -X POST http://127.0.0.1:3997/search -H 'content-type: application/json' \
            -d '{"query":"warm-up","project":"contract-warmup"}' >/dev/null
          bash ../scripts/verify-contract.sh http://127.0.0.1:3997 "$PWD/target/release/memnest" "$data" ||
            { tail -40 "$RUNNER_TEMP/contract.log"; exit 1; }

  # Known advisories in the locked dependency tree. Separate from the build so
  # a new advisory shows up as its own failure.
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit

  # Apple Silicon is the only macOS target ort ships prebuilt binaries for.
  # The lifecycle steps gate the published aarch64-apple-darwin archive.
  macos-source-check:
    runs-on: macos-15
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-apple-darwin
      - name: Native release build
        run: cargo build --release --locked --target aarch64-apple-darwin
      - name: Installer and launchd contract checks
        run: bash scripts/verify-macos-packaging.sh
      - name: Native install, reinstall, restart and removal
        run: |
          bin="$PWD/target/aarch64-apple-darwin/release/memnest"
          scripts/setup.sh --user --bin "$bin"
          scripts/setup.sh --user --bin "$bin" --no-verify
          bash ~/.local/share/memnest/scripts/validate-installed-macos.sh
          bash ~/.local/share/memnest/scripts/uninstall-macos.sh --remove-data
          label="gui/$(id -u)/io.memnest.service"
          if launchctl print "$label" >/dev/null 2>&1; then exit 1; fi
          test ! -e ~/.local/bin/memnest
          test ! -e ~/Library/LaunchAgents/io.memnest.service.plist
          test ! -e ~/.memnest

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Test
        run: cargo test --locked --quiet -- --test-threads=1
      - name: Release build
        run: cargo build --release --locked
      # Parses every .ps1 under scripts and rejects non-ASCII bytes.
      - name: Validate PowerShell installers
        shell: pwsh
        run: .\scripts\verify-release.ps1
      - name: Server starts, answers /health and stops
        shell: pwsh
        run: |
          $exe = (Resolve-Path "target\release\memnest.exe").Path
          $data = Join-Path $env:RUNNER_TEMP "memnest-data"
          $log = Join-Path $env:RUNNER_TEMP "memnest-server.log"
          $server = Start-Process -FilePath $exe -ArgumentList "--host 127.0.0.1 --port 3995 --data-dir `"$data`"" -RedirectStandardError $log -PassThru
          try {
            $healthy = $false
            foreach ($attempt in 1..60) {
              try {
                $healthy = (Invoke-RestMethod "http://127.0.0.1:3995/health").status -eq "ok"
                if ($healthy) { break }
              }
              catch { Start-Sleep -Seconds 1 }
            }
            if (-not $healthy) {
              Get-Content $log
              throw "memnest.exe did not answer /health"
            }
            & $exe --port 3995 --data-dir $data status
            if ($LASTEXITCODE -ne 0) { throw "memnest status failed" }
          }
          finally {
            Stop-Process -Id $server.Id -Force
            $server.WaitForExit()
          }
          if (Get-NetTCPConnection -LocalPort 3995 -State Listen -ErrorAction SilentlyContinue) {
            throw "port 3995 is still listening after the server was stopped"
          }
      # The same staging and zip commands core-release.yml runs on a tag, so a
      # broken Windows archive fails here and not at release time.
      - name: Stage the Windows release archive
        shell: bash
        run: bash scripts/package-release.sh x86_64-pc-windows-msvc target/release/memnest.exe "$RUNNER_TEMP/stage"
      - name: Windows archive unpacks and its binary runs
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "memnest-ci-x86_64-pc-windows-msvc.zip"
          Compress-Archive -Path "$env:RUNNER_TEMP\stage\*" -DestinationPath $archive
          $unpacked = Join-Path $env:RUNNER_TEMP "unpacked"
          Expand-Archive -Path $archive -DestinationPath $unpacked
          foreach ($file in "memnest.exe", "LICENSE", "THIRD_PARTY_NOTICES.md", "README.md", "scripts/install-windows.ps1", "scripts/uninstall-windows.ps1", "scripts/setup-clients.py") {
            if (-not (Test-Path (Join-Path $unpacked $file))) { throw "archive lacks $file" }
          }
          & (Join-Path $unpacked "memnest.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "packaged memnest.exe did not run" }
      - name: Validate Bash installers
        shell: bash
        run: |
          bash -n scripts/install.sh
          bash -n scripts/install-linux.sh
          bash -n scripts/uninstall-linux.sh
          bash -n scripts/preflight-linux.sh
          bash -n scripts/verify-artifact.sh
          bash -n scripts/validate-installed.sh
          bash -n scripts/support-bundle.sh
          bash -n scripts/setup.sh
          bash -n scripts/install-macos.sh
          bash -n scripts/uninstall-macos.sh
          bash -n scripts/validate-installed-macos.sh
          bash -n scripts/package-release.sh
      - name: License metadata
        shell: bash
        run: python3 scripts/check-licenses.py
