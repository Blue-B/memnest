name: Core CI

on:
  pull_request:
    paths:
      - "core/**"
      - ".github/workflows/core-ci.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "core/**"
      - ".github/workflows/core-ci.yml"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Test
        run: cargo test --quiet
      - name: Release build
        run: cargo build --release
      - name: Transcript identity and retry E2E
        run: bash scripts/transcript-e2e.sh target/release/memnest

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Test
        run: cargo test --quiet
      - name: Release build
        run: cargo build --release
      - name: Validate PowerShell installers
        shell: pwsh
        run: .\scripts\verify-release.ps1
      - name: Validate Bash installers
        shell: bash
        run: |
          bash -n scripts/install.sh
          bash -n scripts/install-linux.sh
          bash -n scripts/uninstall-linux.sh
          bash -n scripts/preflight-linux.sh
          bash -n scripts/verify-artifact.sh
          bash -n scripts/validate-installed.sh
          bash -n scripts/support-bundle.sh
      - name: License metadata
        shell: bash
        run: python3 scripts/check-licenses.py
