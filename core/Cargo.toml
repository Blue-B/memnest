[package]
name = "memnest"
version = "0.2.0"
edition = "2024"
authors = ["Blue-B"]
description = "Layered persistent memory for AI agents — Rust core"
license = "MIT"
repository = "https://github.com/Blue-B/memnest"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[features]
default = ["viewer", "mcp"]
viewer = ["askama", "axum"]
mcp = ["rmcp"]

[dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }
tokio-util = "0.7"

# HTTP / Server
axum = { version = "0.8", features = ["macros"], optional = true }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }


# MCP
rmcp = { version = "1.6", features = ["server", "transport-io"], optional = true }

# HTTP client for `memnest hook`, which talks to a running service instead of
# opening the data directory. Already in the tree via fastembed's hf-hub.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Database
rusqlite = { version = "0.39", features = ["bundled", "chrono", "serde_json", "uuid"] }
r2d2 = "0.8"
r2d2_sqlite = "0.34"

# Vector search (HNSW) — pure Rust. The package exposes the crate as `hnsw`.
hnsw = { package = "fast-hnsw", version = "1.0" }

# Full-text search (BM25)
tantivy = "0.26"

# ML / ONNX Runtime
# ort = { version = "2.0.0-rc.12", optional = true }  # disabled until openssl issue resolved
ndarray = "0.16"
fastembed = { version = "5", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
half = "2.4"

# Cryptography
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"

# HTML templating
askama = { version = "0.13", optional = true }

# Logging / Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.16", features = ["v4", "serde"] }
regex = "1.11"
rayon = "1.10"
once_cell = "1.21"
dashmap = "6.1"
parking_lot = "0.12"
walkdir = "2.5"


# CLI
clap = { version = "4.5", features = ["derive"] }

# System dirs
dirs = "6.0"

[dev-dependencies]
tempfile = "3.19"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "hybrid_search"
harness = false
