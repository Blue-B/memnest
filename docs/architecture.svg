<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="820" viewBox="0 0 1360 820" role="img" aria-labelledby="title desc">
  <title id="title">How memnest stores and finds memory</title>
  <desc id="desc">pi, Claude Code, Codex, and other apps send content to memnest. It is separated by project, stored in SQLite, and found again with text and similarity search.</desc>
  <defs>
    <style>
      .bg { fill: #fafaf8; }
      .box { fill: #ffffff; stroke: #d7d8d5; stroke-width: 1.4; }
      .main { fill: #ffffff; stroke: #24554e; stroke-width: 1.8; }
      .note { fill: #f0f4f2; }
      .text { fill: #202321; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .muted { fill: #676b68; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .accent { fill: #24554e; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .code { fill: #565b58; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .line { fill: none; stroke: #808581; stroke-width: 1.5; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#808581"/>
    </marker>
  </defs>

  <rect class="bg" width="1360" height="820"/>

  <text class="text" x="64" y="72" font-size="40" font-weight="700" letter-spacing="-1.1">How memnest stores and finds memory</text>
  <text class="muted" x="64" y="106" font-size="17">pi, Claude Code, and Codex share the same memory. The data is stored on your computer.</text>

  <text class="text" x="64" y="158" font-size="16" font-weight="700">Apps</text>

  <g transform="translate(64 176)">
    <rect class="box" width="286" height="74" rx="4"/>
    <text class="text" x="20" y="31" font-size="19" font-weight="650">pi</text>
    <text class="muted" x="20" y="56" font-size="14">Extension and memory tools</text>
  </g>
  <g transform="translate(379 176)">
    <rect class="box" width="286" height="74" rx="4"/>
    <text class="text" x="20" y="31" font-size="19" font-weight="650">Claude Code</text>
    <text class="muted" x="20" y="56" font-size="14">MCP and prompt hook</text>
  </g>
  <g transform="translate(694 176)">
    <rect class="box" width="286" height="74" rx="4"/>
    <text class="text" x="20" y="31" font-size="19" font-weight="650">Codex</text>
    <text class="muted" x="20" y="56" font-size="14">MCP and chat capture</text>
  </g>
  <g transform="translate(1009 176)">
    <rect class="box" width="286" height="74" rx="4"/>
    <text class="text" x="20" y="31" font-size="19" font-weight="650">Other apps</text>
    <text class="muted" x="20" y="56" font-size="14">Connect through HTTP or MCP</text>
  </g>

  <path class="line" d="M680 260 V286"/>

  <rect class="main" x="64" y="300" width="1231" height="252" rx="6"/>
  <text class="accent" x="88" y="332" font-size="16" font-weight="700">memnest</text>

  <g transform="translate(88 354)">
    <rect class="note" width="342" height="116" rx="4"/>
    <text class="text" x="20" y="38" font-size="22" font-weight="650">Receive memory</text>
    <text class="muted" x="20" y="70" font-size="15">Six memory tools, chat capture,</text>
    <text class="muted" x="20" y="94" font-size="15">and the prompt hook send content in.</text>
  </g>
  <path class="line" d="M442 412 H474"/>
  <g transform="translate(486 354)">
    <rect class="note" width="342" height="116" rx="4"/>
    <text class="text" x="20" y="38" font-size="22" font-weight="650">Store it separately</text>
    <text class="muted" x="20" y="70" font-size="15">Separate projects, redact credentials,</text>
    <text class="muted" x="20" y="94" font-size="15">then write everything to SQLite.</text>
  </g>
  <path class="line" d="M840 412 H872"/>
  <g transform="translate(884 354)">
    <rect class="note" width="387" height="116" rx="4"/>
    <text class="text" x="20" y="38" font-size="22" font-weight="650">Find matching memory</text>
    <text class="muted" x="20" y="70" font-size="15">Search the current project and playbook</text>
    <text class="muted" x="20" y="94" font-size="15">by words and similar content.</text>
  </g>

  <rect x="88" y="490" width="1183" height="40" rx="3" fill="#f5f6f4"/>
  <text class="muted" x="680" y="516" font-size="14" text-anchor="middle">Found text is shown for reference. It is not treated as a command.</text>

  <path class="line" d="M680 562 V588"/>
  <text class="text" x="64" y="620" font-size="16" font-weight="700">Files on your computer</text>

  <g transform="translate(64 638)">
    <rect class="box" width="286" height="108" rx="4"/>
    <text class="code" x="20" y="34" font-size="18" font-weight="700">memory.db</text>
    <text class="muted" x="20" y="65" font-size="14">Main file for memory and</text>
    <text class="muted" x="20" y="87" font-size="14">encrypted secret values</text>
  </g>
  <g transform="translate(379 638)">
    <rect class="box" width="286" height="108" rx="4"/>
    <text class="code" x="20" y="34" font-size="18" font-weight="700">text_index/</text>
    <text class="muted" x="20" y="65" font-size="14">Files used for text search</text>
    <text class="muted" x="20" y="87" font-size="14">Can be built again</text>
  </g>
  <g transform="translate(694 638)">
    <rect class="box" width="286" height="108" rx="4"/>
    <text class="code" x="20" y="34" font-size="18" font-weight="700">vectors/</text>
    <text class="muted" x="20" y="65" font-size="14">Files used to find similar content</text>
    <text class="muted" x="20" y="87" font-size="14">Can be built again</text>
  </g>
  <g transform="translate(1009 638)">
    <rect class="box" width="286" height="108" rx="4"/>
    <text class="code" x="20" y="34" font-size="18" font-weight="700">master.key</text>
    <text class="muted" x="20" y="65" font-size="14">Key used to open secret values</text>
    <text class="muted" x="20" y="87" font-size="14">Kept on your computer</text>
  </g>

  <text class="muted" x="64" y="786" font-size="13">memory.db is the main copy. The search files can be rebuilt if they are removed.</text>
</svg>
