<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="820" viewBox="0 0 1360 820" role="img" aria-labelledby="title desc">
  <title id="title">memnest가 기억을 저장하고 찾는 방식</title>
  <desc id="desc">pi, Claude Code, Codex에서 받은 내용을 프로젝트별로 SQLite에 저장하고, 글자 검색과 비슷한 내용 검색으로 다시 찾는 흐름입니다.</desc>
  <defs>
    <style>
      .bg { fill: #fafaf8; }
      .box { fill: #ffffff; stroke: #d7d8d5; stroke-width: 1.4; }
      .main { fill: #ffffff; stroke: #24554e; stroke-width: 1.8; }
      .note { fill: #f0f4f2; }
      .text { fill: #202321; font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; }
      .muted { fill: #676b68; font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; }
      .accent { fill: #24554e; font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; }
      .code { fill: #565b58; font-family: D2Coding, "SFMono-Regular", Consolas, monospace; }
      .line { fill: none; stroke: #808581; stroke-width: 1.5; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#808581"/>
    </marker>
  </defs>

  <rect class="bg" width="1360" height="820"/>

  <text class="text" x="64" y="72" font-size="40" font-weight="700" letter-spacing="-1.1">memnest가 기억을 저장하고 찾는 방식</text>
  <text class="muted" x="64" y="106" font-size="17">pi, Claude Code, Codex가 같은 기억을 사용합니다. 데이터는 내 컴퓨터에 저장됩니다.</text>

  <text class="text" x="64" y="158" font-size="16" font-weight="700">사용하는 앱</text>

  <g transform="translate(64 176)">
    <rect class="box" width="286" height="74" rx="4"/>
    <text class="text" x="20" y="31" font-size="19" font-weight="650">pi</text>
    <text class="muted" x="20" y="56" font-size="14">확장과 메모리 기능</text>
  </g>
  <g transform="translate(379 176)">
    <rect class="box" width="286" height="74" rx="4"/>
    <text class="text" x="20" y="31" font-size="19" font-weight="650">Claude Code</text>
    <text class="muted" x="20" y="56" font-size="14">MCP와 프롬프트 연결</text>
  </g>
  <g transform="translate(694 176)">
    <rect class="box" width="286" height="74" rx="4"/>
    <text class="text" x="20" y="31" font-size="19" font-weight="650">Codex</text>
    <text class="muted" x="20" y="56" font-size="14">MCP와 대화 저장</text>
  </g>
  <g transform="translate(1009 176)">
    <rect class="box" width="286" height="74" rx="4"/>
    <text class="text" x="20" y="31" font-size="19" font-weight="650">기타 앱</text>
    <text class="muted" x="20" y="56" font-size="14">HTTP 또는 MCP로 연결</text>
  </g>

  <path class="line" d="M680 260 V286"/>

  <rect class="main" x="64" y="300" width="1231" height="252" rx="6"/>
  <text class="accent" x="88" y="332" font-size="16" font-weight="700">memnest</text>

  <g transform="translate(88 354)">
    <rect class="note" width="342" height="116" rx="4"/>
    <text class="text" x="20" y="38" font-size="22" font-weight="650">기억 받기</text>
    <text class="muted" x="20" y="70" font-size="15">메모리 기능 6개, 대화 저장,</text>
    <text class="muted" x="20" y="94" font-size="15">프롬프트 연결로 내용을 받습니다.</text>
  </g>
  <path class="line" d="M442 412 H474"/>
  <g transform="translate(486 354)">
    <rect class="note" width="342" height="116" rx="4"/>
    <text class="text" x="20" y="38" font-size="22" font-weight="650">나눠서 저장</text>
    <text class="muted" x="20" y="70" font-size="15">프로젝트를 구분하고 자격증명을 가린 뒤</text>
    <text class="muted" x="20" y="94" font-size="15">SQLite에 저장합니다.</text>
  </g>
  <path class="line" d="M840 412 H872"/>
  <g transform="translate(884 354)">
    <rect class="note" width="387" height="116" rx="4"/>
    <text class="text" x="20" y="38" font-size="22" font-weight="650">관련 기억 찾기</text>
    <text class="muted" x="20" y="70" font-size="15">현재 프로젝트와 playbook에서 글자와</text>
    <text class="muted" x="20" y="94" font-size="15">비슷한 내용으로 검색합니다.</text>
  </g>

  <rect x="88" y="490" width="1183" height="40" rx="3" fill="#f5f6f4"/>
  <text class="muted" x="680" y="516" font-size="14" text-anchor="middle">찾은 내용은 참고 자료로만 보여주며 명령으로 따르지 않습니다.</text>

  <path class="line" d="M680 562 V588"/>
  <text class="text" x="64" y="620" font-size="16" font-weight="700">내 컴퓨터에 저장되는 파일</text>

  <g transform="translate(64 638)">
    <rect class="box" width="286" height="108" rx="4"/>
    <text class="code" x="20" y="34" font-size="18" font-weight="700">memory.db</text>
    <text class="muted" x="20" y="65" font-size="14">기억과 암호화된 비밀 정보가</text>
    <text class="muted" x="20" y="87" font-size="14">들어 있는 기본 파일</text>
  </g>
  <g transform="translate(379 638)">
    <rect class="box" width="286" height="108" rx="4"/>
    <text class="code" x="20" y="34" font-size="18" font-weight="700">text_index/</text>
    <text class="muted" x="20" y="65" font-size="14">글자 검색용 파일</text>
    <text class="muted" x="20" y="87" font-size="14">필요하면 다시 만들 수 있음</text>
  </g>
  <g transform="translate(694 638)">
    <rect class="box" width="286" height="108" rx="4"/>
    <text class="code" x="20" y="34" font-size="18" font-weight="700">vectors/</text>
    <text class="muted" x="20" y="65" font-size="14">비슷한 내용 검색용 파일</text>
    <text class="muted" x="20" y="87" font-size="14">필요하면 다시 만들 수 있음</text>
  </g>
  <g transform="translate(1009 638)">
    <rect class="box" width="286" height="108" rx="4"/>
    <text class="code" x="20" y="34" font-size="18" font-weight="700">master.key</text>
    <text class="muted" x="20" y="65" font-size="14">비밀 정보를 여는 키</text>
    <text class="muted" x="20" y="87" font-size="14">내 컴퓨터에만 보관</text>
  </g>

  <text class="muted" x="64" y="786" font-size="13">memory.db가 원본이며, 검색용 파일은 지워져도 다시 만들 수 있습니다.</text>
</svg>
