name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        runtime: [node20, node22, bun]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        if: matrix.runtime == 'node20'
        uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Setup Node 22
        if: matrix.runtime == 'node22'
        uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3' }

      - name: Install dependencies
        run: npm install

      - name: Build dist/index.mjs
        run: npm run build

      - name: Verify bundle loads + 12 tools registered (no server)
        run: |
          # Run smoke; live-call checks gracefully skip when 3111 is unreachable.
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bun test/smoke.mjs
          else
            node test/smoke.mjs
          fi
